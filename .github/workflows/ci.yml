name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test · typecheck · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm test

      # Builds without vendoring the simulator: it is a 12MB clone of someone
      # else's repository, and the app degrades to the still crease pattern
      # without it. Vercel's build does vendor it (see apps/web/package.json's
      # vercel-build script), so a deploy still gets the 3D fold view.
      - run: pnpm build

      # The seeded patterns are generated. If the generator and the committed
      # files ever disagree, that is a bug we want to hear about here rather
      # than from a visitor looking at a stale crease pattern.
      - name: Seeded patterns are up to date
        run: |
          pnpm --filter @kamibase/web seed
          if ! git diff --quiet -- apps/web/content; then
            echo "::error::apps/web/content is stale — run 'pnpm --filter @kamibase/web seed' and commit the result"
            git diff --stat -- apps/web/content
            exit 1
          fi

  # The job above builds from the repo root, where `pnpm -r build` happens to
  # build @kamibase/core before apps/web. Vercel does not: it builds from
  # apps/web alone. That difference shipped a broken deploy once — core's dist/
  # is gitignored, so the app could not resolve it — so the deploy path gets
  # its own job that reproduces it exactly, on a clean checkout.
  deploy-build:
    name: deploy build (as Vercel runs it)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Nothing is prebuilt
        run: rm -rf packages/core/dist apps/web/.next apps/web/public/sim

      - name: pnpm run vercel-build, from apps/web
        working-directory: apps/web
        run: pnpm run vercel-build

      - name: The deploy has what it needs
        run: |
          test -d apps/web/.next || { echo "::error::no .next output"; exit 1; }
          test -f apps/web/public/sim/index.html \
            || { echo "::error::the simulator was not vendored"; exit 1; }
          grep -q kamibase-embed.css apps/web/public/sim/index.html \
            || { echo "::error::the simulator's chrome was not stripped"; exit 1; }
          grep -q kamibase-gtag-noop apps/web/public/sim/index.html \
            || { echo "::error::the analytics shim was not installed"; exit 1; }
