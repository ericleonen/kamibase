<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  A monochrome crease pattern organized into named layers, as Inkscape writes
  one. Nothing here is colour-coded: every stroke is black, and the only thing
  that says which crease is which is the layer each was drawn in. The dashed
  layer is deliberately unnamed, so the stroke-style strategy is the only one
  left for it.

  The pattern is a kite base: the two diagonal creases to the top corner, with
  the vertical axis of symmetry.
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     inkscape:version="1.3" width="200" height="200" viewBox="0 0 200 200">
  <g inkscape:label="Paper edge" inkscape:groupmode="layer" id="layer1"
     style="fill:none;stroke:#000000;stroke-width:2">
    <path d="M 0,0 H 200 V 200 H 0 Z"/>
  </g>
  <g inkscape:label="Mountain folds" inkscape:groupmode="layer" id="layer2"
     style="fill:none;stroke:#000000;stroke-width:1.5">
    <line x1="100" y1="0" x2="100" y2="200"/>
  </g>
  <g inkscape:label="Valley folds" inkscape:groupmode="layer" id="layer3"
     style="fill:none;stroke:#000000;stroke-width:1.5">
    <line x1="0" y1="200" x2="100" y2="100"/>
    <line x1="200" y1="200" x2="100" y2="100"/>
  </g>
  <g id="g4" style="fill:none;stroke:#000000;stroke-width:1;stroke-dasharray:4,4">
    <line x1="0" y1="100" x2="200" y2="100"/>
  </g>
  <g inkscape:label="Notes" style="display:none">
    <line x1="10" y1="10" x2="190" y2="10" stroke="#000000"/>
  </g>
</svg>
