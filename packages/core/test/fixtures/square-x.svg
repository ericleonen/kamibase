<?xml version="1.0" encoding="UTF-8"?>
<!--
  The square-x fixture as a hand-written SVG, in the Origami Simulator palette
  of DESIGN.md §3.3: black boundary, red mountains, blue valley. Same pattern
  as square-x.fold, so the two parsers can be compared directly.

  Deliberately plain: presentation attributes, no <style> block, no transforms,
  y growing downward as SVG demands.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <title>Square with an X</title>
  <rect x="0" y="0" width="100" height="100" fill="#ffffff" stroke="none"/>
  <g fill="none" stroke-width="2">
    <rect x="0" y="0" width="100" height="100" stroke="#000000"/>
    <line x1="0" y1="100" x2="50" y2="50" stroke="#ff0000"/>
    <line x1="50" y1="50" x2="100" y2="0" stroke="#ff0000"/>
    <line x1="0" y1="0" x2="50" y2="50" stroke="#ff0000"/>
    <line x1="50" y1="50" x2="100" y2="100" stroke="#0000ff"/>
  </g>
</svg>
